name: Epic Rollup

# Event-driven epic rollup (epic vergil-project/.github#75). When any issue in
# this repo closes, hand off to the reusable ops-epic-rollup workflow, which
# runs `vrg-epic-rollup` to close the parent epic once all its sibling tasks are
# closed. Only a finite epic parent ever rolls up, so it is safe to fire on
# every close: an issue with no `epic`-labeled parent is a no-op, and a
# standing epic never closes. Queue items do have an epic parent: each sits
# under its perpetual queue epic (`Epic (intake)`, `Epic (planning)` or
# `Epic (deferred)`), a standing epic like `Epic (ad hoc)`. When a child of a
# standing epic closes, the rollup moves it into that epic's archive instead
# of closing the epic.
#
# This repo needs it too: every epic's retrospective task lives here, so the
# retrospective's merge is usually the close that should roll the epic up.
# Without this caller the epic waited for the daily Epic Sweep (#373). Thin
# caller per repo convention (cf. epic-sweep.yml / ops.yml).

on:
  issues:
    types: [closed]

permissions:
  contents: read

jobs:
  epic-rollup:
    uses: vergil-project/vergil-actions/.github/workflows/ops-epic-rollup.yml@v2.1
    permissions:
      contents: read
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
